<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>From a price change in the ERP to an announcement in the store</title><defs><marker id="h-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#768390"/></marker><marker id="h-server" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f94fb"/></marker><marker id="h-pi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e17ff0"/></marker><marker id="h-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a742"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0805a"/></marker></defs><rect width="1200" height="690" rx="16" fill="#0d1117" stroke="#3d444d"/><text x="40" y="54" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start">From a price change to the speaker</text><text x="40" y="82" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Fully automatic: facts come from the ERP, words from the model, every number from code.</text><path d="M700 50 H734" fill="none" stroke="#8f94fb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Kadans server</text><path d="M846.3 50 H880.3" fill="none" stroke="#f0a742" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="890.3" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Tellal</text><path d="M942.9 50 H976.9" fill="none" stroke="#e17ff0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="986.9" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Branch Pi</text><rect x="40" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="40" y="124" width="4" height="98" rx="2" fill="#8f94fb"/><circle cx="72" cy="141" r="13" fill="#8f94fb"/><text x="72" y="146" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">1</text><text x="94" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">ERP price drops</text><text x="60" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Go collector reads the</text><text x="60" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">customer's SQL Server</text><text x="60" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">ERP per branch</text><path d="M249 173 H267" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="274" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="274" y="124" width="4" height="98" rx="2" fill="#8f94fb"/><circle cx="306" cy="141" r="13" fill="#8f94fb"/><text x="306" y="146" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">2</text><text x="328" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Facts verified</text><text x="294" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">product, old and new</text><text x="294" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">price, validity: checked</text><text x="294" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">in code, not by a model</text><path d="M483 173 H501" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="508" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="508" y="124" width="4" height="98" rx="2" fill="#f0a742"/><circle cx="540" cy="141" r="13" fill="#f0a742"/><text x="540" y="146" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">3</text><text x="562" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Model writes copy</text><text x="528" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">a Turkish template</text><text x="528" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">with placeholders only,</text><text x="528" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">never a number</text><path d="M717 173 H735" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="742" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="742" y="124" width="4" height="98" rx="2" fill="#f0a742"/><circle cx="774" cy="141" r="13" fill="#f0a742"/><text x="774" y="146" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">4</text><text x="796" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Guard, then fill</text><text x="762" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">any digit is rejected;</text><text x="762" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">code inserts the prices</text><text x="762" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">and the dates</text><path d="M951 173 H969" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="976" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="976" y="124" width="4" height="98" rx="2" fill="#f0a742"/><circle cx="1008" cy="141" r="13" fill="#f0a742"/><text x="1008" y="146" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">5</text><text x="1030" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Speech</text><text x="996" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">one voice; rejected copy</text><text x="996" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">falls back to a verified</text><text x="996" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">sentence, same voice</text><rect x="40" y="272" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="40" y="284" width="4" height="98" rx="2" fill="#8f94fb"/><circle cx="72" cy="301" r="13" fill="#8f94fb"/><text x="72" y="306" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">6</text><text x="94" y="306" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Loudness</text><text x="60" y="334" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">normalized to −16 LUFS</text><text x="60" y="354" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">and −1.5 dBTP,</text><text x="60" y="374" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">48 kHz MP3</text><path d="M249 333 H267" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="274" y="272" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="274" y="284" width="4" height="98" rx="2" fill="#8f94fb"/><circle cx="306" cy="301" r="13" fill="#8f94fb"/><text x="306" y="306" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">7</text><text x="328" y="306" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Stored by hash</text><text x="294" y="334" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">named by its SHA-256,</text><text x="294" y="354" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">stored once for every</text><text x="294" y="374" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">branch with the discount</text><path d="M483 333 H501" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="508" y="272" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="508" y="284" width="4" height="98" rx="2" fill="#8f94fb"/><circle cx="540" cy="301" r="13" fill="#8f94fb"/><text x="540" y="306" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">8</text><text x="562" y="306" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">New plan revision</text><text x="528" y="334" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">declarative, versioned,</text><text x="528" y="354" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">byte-stable; no play</text><text x="528" y="374" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">command exists</text><path d="M717 333 H735" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="742" y="272" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="742" y="284" width="4" height="98" rx="2" fill="#e17ff0"/><circle cx="774" cy="301" r="13" fill="#e17ff0"/><text x="774" y="306" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">9</text><text x="796" y="306" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Hint, then pull</text><text x="762" y="334" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">MQTT: “new revision”;</text><text x="762" y="354" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">HTTPS fetch, every file</text><text x="762" y="374" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">verified by its hash</text><path d="M951 333 H969" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="976" y="272" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="976" y="284" width="4" height="98" rx="2" fill="#e17ff0"/><circle cx="1008" cy="301" r="13" fill="#e17ff0"/><text x="1008" y="306" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">10</text><text x="1030" y="306" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Duck and play</text><text x="996" y="334" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">only if hours, prayer</text><text x="996" y="354" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">silence and a trusted</text><text x="996" y="374" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">clock all allow it</text><path d="M1078.0 239 V256 H142.0 V266" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><text x="40" y="452" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Step 10, up close: the music ducks under the announcement</text><rect x="420" y="470" width="400" height="130" rx="8" fill="#2d2010" stroke="#2d2010" stroke-width="1.2"/><text x="620" y="544" font-size="14" font-weight="600" fill="#f0a742" text-anchor="middle">announcement plays</text><path d="M820 464 V600" fill="none" stroke="#f0a742" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="828" y="478" font-size="13" font-weight="600" fill="#f0a742" text-anchor="start">player exits</text><path d="M120 600 H1160" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="497" font-size="13" font-weight="400" fill="#9198a1" text-anchor="end">100</text><text x="108" y="578.0" font-size="13" font-weight="400" fill="#9198a1" text-anchor="end">25</text><text x="40" y="537.5" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Music</text><path d="M120 492 H330 L420 573.0 H820 L1000 492 H1160" fill="none" stroke="#e17ff0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><text x="375" y="622" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">700 ms</text><text x="910" y="622" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">1400 ms</text><text x="1160" y="452" font-size="13" font-weight="400" fill="#9198a1" text-anchor="end">Music returns only after the player really exits, not after an estimated duration.</text><text x="120" y="622" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">claim, then duck</text></svg>
